# Alembic config.
# Keep this file ASCII-only: Alembic reads it with the system locale encoding,
# so non-ASCII comments break on Windows (cp1252). Russian comments live in
# migrations/env.py and in the migration files themselves.

[alembic]
script_location = migrations

# New migration files are named 0002_<slug>.py, 0003_<slug>.py and so on.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .

# Left empty on purpose: the database URL is built in migrations/env.py
# from config.py, so DB settings stay in one place.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
